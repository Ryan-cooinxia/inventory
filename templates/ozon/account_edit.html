{% extends "base.html" %}
{% block title %}编辑店铺 — 仓库记账系统{% endblock %}
{% block content %}
<h2 class="mb-3">编辑店铺</h2>
<div class="row">
  <div class="col-lg-6">
    <form method="POST">
      <div class="mb-3"><label class="form-label fw-bold">店铺名称</label><input type="text" name="name" class="form-control" value="{{ acc.name }}" required></div>
      <div class="row mb-3">
        <div class="col"><label class="form-label fw-bold">店铺类型</label><select name="shop_type" class="form-select"><option value="cross_border" {% if acc.shop_type == 'cross_border' %}selected{% endif %}>跨境店</option><option value="local" {% if acc.shop_type == 'local' %}selected{% endif %}>本土店</option></select></div>
        <div class="col"><label class="form-label fw-bold">环境</label><select name="environment" class="form-select"><option value="test" {% if acc.environment == 'test' %}selected{% endif %}>测试店</option><option value="production" {% if acc.environment == 'production' %}selected{% endif %}>正式店</option></select></div>
      </div>
      <div class="mb-3"><label class="form-label fw-bold">Client-Id</label><input type="text" name="client_id" class="form-control" value="{{ acc.client_id }}" required></div>
      <div class="mb-3"><label class="form-label fw-bold">Api-Key</label><input type="password" name="api_key" class="form-control" placeholder="留空则不修改"></div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{{ url_for('ozon.accounts') }}" class="btn btn-outline-secondary">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
