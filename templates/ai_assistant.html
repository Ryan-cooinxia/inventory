{% extends "base.html" %}
{% block title %}AI 仓库助手{% endblock %}

{% block head %}
<style>
    /* 全屏助手页面隐藏右下角的浮动助手，避免冲突 */
    #ai-assistant-btn,
    #ai-chat-panel {
        display: none !important;
    }
</style>
{% endblock %}

{% block content %}
<div style="display:flex; flex-direction:column; height: calc(100vh - 120px);">
    <div id="ai-chat-messages-full" style="flex:1; overflow-y:auto; padding:16px; font-size:15px; border:1px solid #eee; border-radius:8px; background:#fafafa;"></div>
    <div style="margin-top:12px; display:flex; gap:8px; align-items:center;">
        <!-- 图片上传 -->
        <label for="ai-image-input-full" style="cursor:pointer;">
            <span class="btn btn-outline-primary">📷</span>
        </label>
        <input type="file" id="ai-image-input-full" accept="image/*" capture="environment" style="position:absolute; opacity:0; width:0; height:0;">

        <!-- 文件上传 -->
        <label for="ai-file-input-full" style="cursor:pointer;">
            <span class="btn btn-outline-primary">📎</span>
        </label>
        <input type="file" id="ai-file-input-full" accept=".xlsx,.xls,.pdf" style="position:absolute; opacity:0; width:0; height:0;">

        <input type="text" id="ai-chat-input-full" placeholder="输入操作指令…" style="flex:1; padding:8px 12px; border:1px solid #ddd; border-radius:6px; font-size:15px;">
        <button id="ai-chat-send-full" class="btn btn-primary">发送</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    const messagesDiv = document.getElementById('ai-chat-messages-full');
    const input = document.getElementById('ai-chat-input-full');
    const sendBtn = document.getElementById('ai-chat-send-full');
    const imageInput = document.getElementById('ai-image-input-full');
    const fileInput = document.getElementById('ai-file-input-full');

    function addMessage(text, isUser, save = true) {
        const div = document.createElement('div');
        div.style.margin = '8px 0';
        div.style.textAlign = isUser ? 'right' : 'left';
        const formatted = text.replace(/\n/g, '<br>');
        div.innerHTML = `<span style="display:inline-block; max-width:80%; padding:8px 12px; border-radius:12px; font-size:15px; ${isUser ? 'background:#0d6efd; color:white;' : 'background:#fff; color:#333; border:1px solid #ddd;'}">${formatted}</span>`;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        if (save) {
            const msgs = [];
            messagesDiv.querySelectorAll('span').forEach(s => {
                msgs.push({ text: s.innerText, isUser: s.style.background.includes('13, 110, 253') });
            });
            localStorage.setItem('ai_chat_history_full', JSON.stringify(msgs.slice(-20)));
        }
    }

    function loadHistory() {
        const saved = localStorage.getItem('ai_chat_history_full');
        if (saved) JSON.parse(saved).forEach(m => addMessage(m.text, m.isUser, false));
    }

    async function sendMessage(message, imageBase64 = null, file = null) {
        if (file) {
            addMessage('📎 已上传文件：' + file.name, true);
        } else if (imageBase64) {
            addMessage('📷 图片已发送', true);
        } else {
            addMessage(message, true);
        }
        input.value = '';

        const loadingDiv = document.createElement('div');
        loadingDiv.style.margin = '8px 0';
        loadingDiv.innerHTML = '<span style="display:inline-block; max-width:80%; padding:8px 12px; border-radius:12px; background:#f0f0f0; color:#999;">思考中...</span>';
        messagesDiv.appendChild(loadingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        try {
            let resp;
            if (file) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('message', message || '请分析该文件');
                resp = await fetch('/api/agent/chat', { method: 'POST', body: formData });
            } else {
                resp = await fetch('/api/agent/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message, image: imageBase64})
                });
            }
            const data = await resp.json();
            loadingDiv.remove();
            if (data.error) {
                addMessage('❌ ' + data.error, false);
            } else if (data.reply) {
                addMessage(data.reply, false);
            } else if (data.action_data) {
                addMessage(JSON.stringify(data.action_data, null, 2), false);
            }
        } catch(e) {
            loadingDiv.remove();
            addMessage('❌ 请求失败：' + e.message, false);
        }
    }

    sendBtn.addEventListener('click', () => {
        const msg = input.value.trim();
        if (msg) sendMessage(msg);
    });
    input.addEventListener('keypress', e => {
        if (e.key === 'Enter') {
            const msg = input.value.trim();
            if (msg) sendMessage(msg);
        }
    });

    imageInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            const base64 = ev.target.result.split(',')[1];
            sendMessage(input.value.trim() || '请帮我识别这个单据并入库', base64);
        };
        reader.readAsDataURL(file);
    });

    fileInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        sendMessage(input.value.trim(), null, file);
    });

    loadHistory();
})();
</script>
{% endblock %}
