{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h2 class="mb-3">注册新账号</h2>
        <form method="POST">
            <div class="mb-3">
                <input name="username" class="form-control" placeholder="用户名" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="密码" required>
            </div>
            <button type="submit" class="btn btn-success w-100">注册</button>
        </form>
        <p class="mt-2">已有账号？<a href="{{ url_for('auth.login') }}">登录</a></p>
    </div>
</div>
{% endblock %}
