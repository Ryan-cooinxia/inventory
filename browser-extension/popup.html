<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品采集</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:360px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:14px; color:#333; }
  .header { background:#198754; color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
  .header h1 { font-size:16px; font-weight:600; }
  .platform-badge { display:inline-block; padding:2px 10px; border-radius:10px; font-size:12px; font-weight:700; }
  .platform-badge._1688 { background:#e6002b; color:#fff; }
  .platform-badge.taobao { background:#ff4400; color:#fff; }
  .platform-badge.tmall { background:#e6002b; color:#fff; }
  .platform-badge.pinduoduo { background:#e6004c; color:#fff; }

  .container { padding:16px; }
  .field { margin-bottom:10px; display:flex; gap:8px; }
  .field-label { color:#6c757d; font-size:12px; min-width:56px; padding-top:2px; }
  .field-value { font-weight:500; flex:1; word-break:break-all; }
  .field-value.title { font-size:15px; line-height:1.4; }

  .stats { display:flex; gap:12px; margin:12px 0; }
  .stat { flex:1; background:#f8f9fa; border-radius:6px; padding:8px; text-align:center; }
  .stat-num { font-size:20px; font-weight:700; color:#198754; }
  .stat-label { font-size:11px; color:#6c757d; margin-top:2px; }

  .sku-list { max-height:120px; overflow-y:auto; background:#f8f9fa; border-radius:6px; padding:8px; margin:10px 0; font-size:12px; }
  .sku-item { padding:3px 0; border-bottom:1px solid #eee; }
  .sku-item:last-child { border:none; }

  .error-box { background:#fff3cd; border:1px solid #ffc107; border-radius:6px; padding:10px; color:#856404; font-size:13px; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 20px; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; transition:all .15s; width:100%; }
  .btn-collect { background:#198754; color:#fff; }
  .btn-collect:hover { background:#146c43; }
  .btn-collect:disabled { background:#a3cfbb; cursor:not-allowed; }
  .btn-retry { background:#0d6efd; color:#fff; margin-top:8px; }

  .status { padding:8px 12px; border-radius:6px; margin-top:10px; font-size:13px; text-align:center; }
  .status.success { background:#d1e7dd; color:#0f5132; }
  .status.error { background:#f8d7da; color:#842029; }
  .status.info { background:#cfe2ff; color:#084298; }

  .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>📦 商品采集器</h1>
</div>

<div class="container" id="content">
  <div class="status info">检查当前页面...</div>
</div>

<script src="popup.js"></script>
</body>
</html>
